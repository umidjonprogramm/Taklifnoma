<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taklifnoma yaratish</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Great+Vibes&family=Jost:wght@300;400;500&family=Playfair+Display:ital,wght@0,500;1,500&display=swap">
<style>
:root{--bg:#eef1f6;--pn:#fff;--tx:#1b2233;--mu:#5d6679;--ln:#d6dbe6;--ui:#24407a;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161f;--pn:#1b212e;--tx:#e8ecf5;--mu:#9aa4b8;--ln:#2f3748;--ui:#8fb0ff;--on:#10162a}}
:root[data-theme="dark"]{--bg:#12161f;--pn:#1b212e;--tx:#e8ecf5;--mu:#9aa4b8;--ln:#2f3748;--ui:#8fb0ff;--on:#10162a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "Jost",system-ui,sans-serif}
header{padding:28px 20px 8px;max-width:1100px;margin:auto}
h1{font:600 clamp(28px,5vw,40px)/1.1 "Cormorant Garamond",Georgia,serif;margin:0 0 6px}
header p{margin:0;color:var(--mu);max-width:56ch}
main{display:grid;gap:20px;max-width:1100px;margin:auto;padding:16px 20px 40px;grid-template-columns:minmax(0,1fr)}
@media(min-width:860px){main{grid-template-columns:minmax(0,420px) minmax(0,1fr);align-items:start}.pv{position:sticky;top:16px}}
.pn{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:18px}
fieldset{border:0;padding:0;margin:0 0 18px}
legend,label{font-weight:500;font-size:14px;margin-bottom:5px;display:block;padding:0}
.f{margin-bottom:12px}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:9px 10px}
textarea{min-height:92px;resize:vertical}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
:focus-visible{outline:2px solid var(--ui);outline-offset:2px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.chips [data-s=yulduz]{background:linear-gradient(#1d2e63,#070b1c);color:#c4d3ff}
.chips [data-s=shafaq]{background:linear-gradient(135deg,#ffd9c0,#c9a7ee);color:#5a2a58}
.chips [data-s=bahor]{background:linear-gradient(#f3f9ef,#cfe8d2);color:#2f6a43}
.chips [data-s=feruza]{background:linear-gradient(#0f8290,#0b5560);color:#f3d58a}
.chips [data-s=bordo]{background:linear-gradient(#5a1230,#1c0610);color:#e8b4a0}
.chips button{font:inherit;font-size:12px;height:62px;border-radius:8px;border:1px solid var(--ln);cursor:pointer;padding:0 0 5px;display:flex;align-items:flex-end;justify-content:center;color:#fff;transition:transform .15s}
.chips button:hover{transform:translateY(-2px)}
.chips button[aria-pressed="true"]{outline:2px solid var(--ui);outline-offset:2px}
.chips [data-s=atlas]{background:linear-gradient(#1c2a63,#2b3d86)}
.chips [data-s=royal]{background:linear-gradient(#2a2418,#0e0d0b);color:#e8cd7e}
.chips [data-s=suzani]{background:linear-gradient(#8a1a2e,#5c0f1d);color:#f0c36a}
.chips [data-s=zumrad]{background:linear-gradient(#14584a,#0a2a24);color:#e5cf88}
.chips [data-s=marmar]{background:linear-gradient(#fafaf8,#e4e2dd);color:#7a6128}
.chips [data-s=klassik]{background:#fbf8f1;color:#8a6d2c}
.chips [data-s=minimal]{background:#fff;color:#111}
.chips [data-s=gul]{background:linear-gradient(#fdeef0,#f8dde5);color:#a63f60}
.sw{display:flex;gap:10px;align-items:center}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid var(--ln);cursor:pointer;padding:0}
.sw button[aria-pressed="true"]{outline:2px solid var(--ui);outline-offset:2px}
.sw .auto{background:conic-gradient(#c9a24b,#c4577a,#1f8a70,#3b6fd4,#c9a24b)}
.act{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.act button{font:inherit;font-weight:500;padding:10px 16px;border-radius:6px;border:1px solid var(--ui);background:var(--ui);color:var(--on);cursor:pointer}
.act button.g{background:transparent;color:var(--ui)}
#st{min-height:22px;margin:8px 0 0;font-size:14px;color:var(--mu)}
/* karta */
.card{container-type:inline-size;width:100%;max-width:460px;margin:auto;aspect-ratio:3/4.4;position:relative;overflow:hidden;border-radius:4px;text-align:center;box-shadow:0 28px 60px -14px rgba(0,0,0,.4),0 2px 6px rgba(0,0,0,.12)}
.in{position:absolute;inset:4cqw;border:1px solid var(--ac);padding:7cqw 6cqw;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:3.2cqw}
.kind{margin:0;font-size:4.2cqw;letter-spacing:.14em;color:var(--ac)}
.names{margin:0;font-size:12cqw;line-height:1.05;font-weight:400}
.amp{display:block;font-size:6cqw;color:var(--ac);margin:1cqw 0}
.msg{margin:0;font-size:3.9cqw;line-height:1.55;max-width:30ch;opacity:.92}
.rule{width:26cqw;height:1px;background:linear-gradient(90deg,transparent,var(--ac),transparent);border:0;margin:0}
.day{font-size:15cqw;line-height:1;color:var(--ac)}
.mon{font-size:5cqw;margin-top:1cqw}
.meta{font-size:4cqw;line-height:1.5}
.cd{font-size:3.6cqw;color:var(--ac)}
.host{margin:0;font-size:3.8cqw;opacity:.9}
.s-atlas{background:#1c2a63 repeating-linear-gradient(45deg,rgba(255,255,255,.06) 0 2px,transparent 2px 13px) ;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.06) 0 2px,transparent 2px 13px),repeating-linear-gradient(-45deg,rgba(255,255,255,.06) 0 2px,transparent 2px 13px);color:#f6ecd2;--ac:#e0b960;font-family:"Cormorant Garamond",Georgia,serif}
.s-atlas .in{border-width:2px;outline:1px solid var(--ac);outline-offset:-2.2cqw;background:rgba(28,42,99,.72)}
.s-atlas .names{font-weight:600}
.s-klassik{background:#fbf8f1;color:#3a3226;--ac:#b8913c;font-family:"Cormorant Garamond",Georgia,serif}
.s-klassik .in{box-shadow:0 0 0 1.2cqw #fbf8f1,0 0 0 1.5cqw var(--ac)}
.s-klassik .names{font-family:"Great Vibes",cursive;font-size:14cqw}
.s-minimal{background:#fff;color:#111;--ac:#111;font-family:"Jost",system-ui,sans-serif;font-weight:300}
.s-minimal .in{border:0;border-top:1px solid #111;border-bottom:1px solid #111;inset:7cqw 6cqw}
.s-minimal .names{font-size:10cqw;font-weight:300}
.s-minimal .amp{font-size:5cqw}
.s-gul{background:linear-gradient(170deg,#fdeef0,#f8dde5);color:#5a2a3a;--ac:#c4577a;font-family:"Cormorant Garamond",Georgia,serif}
.s-gul .names{font-family:"Great Vibes",cursive;font-size:14cqw}
.s-gul .in::before,.s-gul .in::after{content:"🌷🌿🌸";position:absolute;left:0;right:0;text-align:center;font-size:6cqw;letter-spacing:2cqw}
.s-gul .in::before{top:2.5cqw}.s-gul .in::after{bottom:2.5cqw}
.kind,.amp,.day,.cd{background:var(--fg,linear-gradient(var(--ac),var(--ac)));-webkit-background-clip:text;background-clip:text;color:transparent}
.s-royal{background:radial-gradient(120% 90% at 50% 0%,#2e2819 0,#0e0d0b 62%);color:#efe6cf;--ac:#d4b25a;--fg:linear-gradient(135deg,#8f6d22,#f6e3a0 35%,#c19a3d 55%,#f9eab4 78%,#9a7626);font-family:"Playfair Display",Georgia,serif}
.s-royal .in{border:1px solid rgba(212,178,90,.75);outline:1px solid rgba(212,178,90,.35);outline-offset:-2cqw}
.s-royal .names{font-style:italic;font-weight:500;font-size:10.5cqw;background:var(--fg);-webkit-background-clip:text;background-clip:text;color:transparent}
.s-royal .msg{font-family:"Cormorant Garamond",Georgia,serif;font-size:4.2cqw}
.s-suzani{background:#6e1423 radial-gradient(circle,rgba(255,255,255,.08) 0 1.1cqw,transparent 1.2cqw) 0 0/8cqw 8cqw;color:#fbe9d0;--ac:#f0c36a;--fg:linear-gradient(135deg,#d9a441,#fbe3a1 50%,#d09a38);font-family:"Cormorant Garamond",Georgia,serif}
.s-suzani .in{background:rgba(104,18,34,.88);border:2px solid var(--ac);outline:1px solid var(--ac);outline-offset:-2.2cqw}
.s-suzani .names{font-weight:600}
.s-zumrad{background:linear-gradient(160deg,#0f4538,#082520);color:#e9f3ec;--ac:#d9bd6c;--fg:linear-gradient(135deg,#a88532,#f3de9a 50%,#b8944a);font-family:"Cormorant Garamond",Georgia,serif}
.s-zumrad .in{border:1px solid var(--ac);border-radius:46cqw 46cqw 3cqw 3cqw;padding-top:14cqw}
.s-zumrad .names{font-family:"Playfair Display",Georgia,serif;font-size:10cqw}
.s-marmar{background:radial-gradient(60% 40% at 18% 14%,rgba(150,150,165,.28),transparent),radial-gradient(50% 35% at 86% 82%,rgba(150,150,165,.24),transparent),radial-gradient(30% 20% at 70% 30%,rgba(190,190,200,.25),transparent),linear-gradient(#fbfbf9,#ebe9e4);color:#2b2b2e;--ac:#a8863a;--fg:linear-gradient(135deg,#8a6a22,#e3c46f 50%,#9c7a30);font-family:"Cormorant Garamond",Georgia,serif}
.s-marmar .in{border:1px solid var(--ac);outline:1px solid rgba(168,134,58,.4);outline-offset:-2cqw}
.s-marmar .names{font-family:"Playfair Display",Georgia,serif;font-size:10cqw}
[hidden]{display:none!important}
.fx{background:var(--fg,linear-gradient(var(--ac),var(--ac)));-webkit-background-clip:text;background-clip:text;color:transparent}
.s-royal{--nf:"Playfair Display",Georgia,serif;--ni:italic;--sf:rgba(255,255,255,.05);--pc:#111}
.s-atlas,.s-suzani{--nf:"Cormorant Garamond",Georgia,serif;--nw:600;--sf:rgba(255,255,255,.08);--pc:#111}
.s-zumrad{--nf:"Playfair Display",Georgia,serif;--sf:rgba(255,255,255,.06);--pc:#111}
.s-marmar{--nf:"Playfair Display",Georgia,serif;--sf:rgba(255,255,255,.6);--pc:#fff}
.s-klassik,.s-gul{--nf:"Great Vibes",cursive;--nz:clamp(58px,14vw,118px);--sf:rgba(255,255,255,.6);--pc:#fff}
.s-minimal{--nf:"Jost",sans-serif;--nw:300;--sf:transparent;--pc:#fff}
.site{min-height:100svh;text-align:center;background-attachment:fixed!important}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;padding:10px;background:rgba(10,12,18,.74);backdrop-filter:blur(8px);color:#fff;font-size:14px}
.bar button{font:inherit;color:#fff;background:transparent;border:1px solid rgba(255,255,255,.5);border-radius:6px;padding:6px 12px;cursor:pointer}
.hero{min-height:92svh;display:grid;place-items:center;padding:36px 16px}
.frame{width:min(100%,760px);padding:clamp(30px,6vw,64px) clamp(18px,5vw,56px);border:1px solid var(--ac);outline:1px solid var(--ac);outline-offset:-10px;display:flex;flex-direction:column;align-items:center;gap:18px}
.s-zumrad .frame{border-radius:min(50vw,380px) min(50vw,380px) 6px 6px;padding-top:clamp(70px,14vw,130px);outline:0}
.s-minimal .frame{border-left:0;border-right:0;outline:0}
.s-gul .frame::before{content:"🌷🌿🌸";letter-spacing:.4em}
.kd{margin:0;font-size:clamp(15px,2.4vw,19px);letter-spacing:.16em}
.h-names{margin:0;font-family:var(--nf,serif);font-weight:var(--nw,500);font-style:var(--ni,normal);font-size:var(--nz,clamp(44px,11vw,98px));line-height:1.08}
.s-bordo .h-names,.s-feruza .h-names,.s-yulduz .h-names,.s-royal .h-names,.s-zumrad .h-names,.s-marmar .h-names,.s-suzani .h-names{background:var(--fg);-webkit-background-clip:text;background-clip:text;color:transparent}
.am{display:block;font-size:.42em;margin:.1em 0;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic}
.rl{width:min(60%,240px);height:1px;background:linear-gradient(90deg,transparent,var(--ac),transparent)}
.hd{margin:0;font-size:clamp(18px,3vw,24px)}
.cdw{display:flex;gap:clamp(8px,2.5vw,18px);justify-content:center;flex-wrap:wrap}
.cb{min-width:68px;padding:10px 8px;border:1px solid var(--ac);background:var(--sf);display:flex;flex-direction:column}
.cn{font-size:clamp(26px,5vw,38px);font-variant-numeric:tabular-nums;line-height:1.1}
.cl{font-size:13px;opacity:.8}
.sec{padding:72px 20px;max-width:880px;margin:auto;display:flex;flex-direction:column;align-items:center;gap:26px}
.lead{margin:0;max-width:30ch;font-size:clamp(21px,3.4vw,30px);line-height:1.55}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;width:100%}
.ic{padding:26px 18px;background:var(--sf);border:1px solid var(--ac)}
.ic h3{margin:0 0 8px;font-size:15px;font-weight:500;opacity:.8}
.iv{margin:0;font-size:clamp(22px,3vw,28px);line-height:1.25}
.is{margin:6px 0 0;opacity:.85}
.ml{color:inherit;text-decoration-color:var(--ac)}
.st{margin:0;font-size:clamp(26px,4vw,36px);font-weight:500}
.rv{display:flex;flex-direction:column;gap:16px;width:min(100%,420px)}
.rv input{font:inherit;color:inherit;background:transparent;border:0;border-bottom:1px solid var(--ac);border-radius:0;padding:10px 4px;text-align:center}
.lb{display:flex;flex-direction:column;gap:4px;font-size:14px;margin:0}
.cs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.ch,.cta{font:inherit;padding:11px 20px;border:1px solid var(--ac);background:transparent;color:inherit;cursor:pointer;text-decoration:none;display:inline-block}
.ch[aria-pressed="true"],.cta{background:var(--ac);color:var(--pc,#111)}
.cta.g{background:transparent;color:inherit}
.ft{padding:56px 20px calc(56px + env(safe-area-inset-bottom,0px))}.ft p{margin:0}.hn{font-size:clamp(24px,4vw,34px);margin-top:6px!important}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.frame>*{animation:up .9s both cubic-bezier(.2,.7,.2,1)}
.frame>:nth-child(2){animation-delay:.15s}.frame>:nth-child(3){animation-delay:.3s}.frame>:nth-child(4){animation-delay:.45s}.frame>:nth-child(5){animation-delay:.6s}.frame>:nth-child(6){animation-delay:.75s}
@media (prefers-reduced-motion:reduce){.frame>*{animation:none}}
.s-yulduz{background:radial-gradient(ellipse at 50% 0,#1d2e63,#070b1c 72%);color:#e9eeff;--ac:#c4d3ff;--fg:linear-gradient(135deg,#8ea8ea,#fff 50%,#9db5f2);--nf:"Playfair Display",Georgia,serif;--ni:italic;--sf:rgba(255,255,255,.06);--pc:#0a1030;font-family:"Cormorant Garamond",Georgia,serif}
.s-yulduz::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(1px 1px at 20% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 70% 20%,#fff,transparent),radial-gradient(1px 1px at 40% 70%,#fff,transparent),radial-gradient(1.5px 1.5px at 85% 60%,#fff,transparent),radial-gradient(1px 1px at 10% 85%,#fff,transparent),radial-gradient(1px 1px at 60% 90%,#fff,transparent),radial-gradient(1px 1px at 5% 12%,#fff,transparent);animation:tw 4s ease-in-out infinite alternate}
.site.s-yulduz::before{position:fixed}
@keyframes tw{from{opacity:.3}to{opacity:1}}
.s-shafaq{background:linear-gradient(135deg,#ffd9c0,#ffb3c1,#c9a7ee,#9fb8f5);background-size:300% 300%;color:#3b2340;--ac:#8a3f7a;--nf:"Great Vibes",cursive;--nz:clamp(58px,14vw,118px);--sf:rgba(255,255,255,.45);--pc:#fff;font-family:"Cormorant Garamond",Georgia,serif;animation:dr 16s ease infinite}
@keyframes dr{50%{background-position:100% 100%}}
.s-bahor{background:linear-gradient(#f3f9ef,#dcefdc);color:#24442f;--ac:#3f8a5a;--fg:linear-gradient(135deg,#2f7a4c,#8cc59a 50%,#2f7a4c);--nf:"Great Vibes",cursive;--nz:clamp(58px,14vw,118px);--sf:rgba(255,255,255,.65);--pc:#fff;font-family:"Cormorant Garamond",Georgia,serif}
.s-feruza{background:#0b6772 radial-gradient(circle,rgba(255,255,255,.1) 0 1.1cqw,transparent 1.2cqw) 0 0/9cqw 9cqw;color:#f4fbfa;--ac:#f3d58a;--fg:linear-gradient(135deg,#d9b25a,#fff0b8 50%,#d1a64a);--nf:"Cormorant Garamond",Georgia,serif;--nw:600;--sf:rgba(0,0,0,.18);--pc:#111;font-family:"Cormorant Garamond",Georgia,serif}
.s-feruza .in{background:rgba(8,86,96,.86);border:2px solid var(--ac);outline:1px solid var(--ac);outline-offset:-2.2cqw}
.s-bordo{background:radial-gradient(120% 90% at 50% 0,#5a1230,#1c0610 70%);color:#fbe7e1;--ac:#e8b4a0;--fg:linear-gradient(135deg,#b76e79,#f7d6cb 50%,#b76e79);--nf:"Playfair Display",Georgia,serif;--ni:italic;--sf:rgba(255,255,255,.06);--pc:#111;font-family:"Cormorant Garamond",Georgia,serif}
.s-yulduz .names,.s-bordo .names{font-family:"Playfair Display",Georgia,serif;font-style:italic;font-size:10.5cqw}
.s-shafaq .names,.s-bahor .names{font-family:"Great Vibes",cursive;font-size:14cqw}
.s-feruza .names{font-weight:600}
.hero,.sec,.ft{position:relative;z-index:2}
.ri{opacity:0;transform:translateY(26px);transition:opacity 1s ease,transform 1s ease}.ri.on{opacity:1;transform:none}
.site .iv,.site .cn,.site .hn,.site .am,.site .sg{background-size:220% auto;animation:sh 6s ease-in-out infinite alternate}
@keyframes sh{from{background-position:0 0}to{background-position:100% 0}}
.frame>.h-names{animation-name:bl;animation-duration:1.7s}
@keyframes bl{from{opacity:0;filter:blur(14px);letter-spacing:.18em}to{opacity:1;filter:none;letter-spacing:normal}}
.site:not(.go) .frame>*{animation-play-state:paused}
.sg{margin:0;font-size:clamp(28px,5vw,44px);font-family:var(--nf,serif);font-style:var(--ni,normal);font-weight:var(--nw,500)}
.tl{position:relative;width:min(100%,540px);display:flex;flex-direction:column;gap:28px}
.tl::before{content:"";position:absolute;left:50%;top:6px;bottom:6px;width:1px;background:var(--ac);transform:scaleY(0);transform-origin:top;transition:transform 2s ease}
.tl.on::before{transform:scaleY(1)}
.ti{display:grid;grid-template-columns:1fr 24px 1fr;gap:12px;align-items:center;text-align:left}
.ti::before{content:"";grid-column:2;grid-row:1;width:11px;height:11px;border-radius:50%;background:var(--ac);justify-self:center;position:relative}
.tt{grid-column:1;grid-row:1;text-align:right;font-size:clamp(22px,4vw,28px)}
.tn{grid-column:3;grid-row:1;font-size:clamp(17px,2.6vw,21px)}
.cue{position:absolute;bottom:20px;left:50%;width:14px;height:14px;margin-left:-7px;border-right:2px solid var(--ac);border-bottom:2px solid var(--ac);transform:rotate(45deg);animation:cu 1.8s ease-in-out infinite}
@keyframes cu{50%{transform:translateY(10px) rotate(45deg)}}
.fall{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.fall span{position:absolute;top:-8vh;color:var(--ac);animation:fl linear infinite}
@keyframes fl{0%{transform:translate(0,-8vh) rotate(0);opacity:0}10%{opacity:.8}50%{transform:translate(30px,55vh) rotate(180deg)}90%{opacity:.8}100%{transform:translate(-14px,112vh) rotate(360deg);opacity:0}}
.site:not(.go){height:100svh;overflow:hidden}
.env{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:inherit;transition:transform 1.1s cubic-bezier(.7,0,.2,1),opacity 1s}
.env.gone{transform:translateY(-100%);opacity:0}
.evw{display:flex;flex-direction:column;align-items:center;gap:24px;perspective:900px}
.ev{position:relative;width:min(78vw,360px);aspect-ratio:3/2;border:1px solid var(--ac);background:var(--sf);animation:fb 3.2s ease-in-out infinite}
@keyframes fb{50%{transform:translateY(-9px)}}
.ev::after{content:"";position:absolute;inset:0;background:var(--ac);opacity:.14;clip-path:polygon(0 100%,50% 38%,100% 100%)}
